name: Verify assessment
on: [push, pull_request]
jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bilcode
          POSTGRES_PASSWORD: bilcode
          POSTGRES_DB: bilcode_test
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U bilcode -d bilcode_test" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://bilcode:bilcode@localhost:5432/bilcode_test
      DIRECT_URL: postgresql://bilcode:bilcode@localhost:5432/bilcode_test
      TEST_DATABASE_URL: postgresql://bilcode:bilcode@localhost:5432/bilcode_test
      SESSION_SECRET: ci-only-placeholder-session-key-at-least-32-characters
      NODE_ENV: test
      STORAGE_DRIVER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv run --project ml/inference pytest ml/inference/test_app.py -q
